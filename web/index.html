<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bible_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>聖經 · 和合本</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google 登入（GIS）用戶端 ID：官方按鈕需要這個 meta 才能運作 -->
  <meta name="google-signin-client_id"
        content="321894659059-37dheo53g2m7ocsbindla4jsi8tmu43g.apps.googleusercontent.com">
</head>
<body>
  <script>
    // 清掉舊版留下的 service worker 與快取（曾造成更新後白屏、要重整兩次）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    // 鎖定完整版 CanvasKit：chromium 精簡版的文字排版在部分環境會整頁無字
    _flutter.loader.load({
      config: { canvasKitVariant: "full" }
    });
  </script>
</body>
</html>
