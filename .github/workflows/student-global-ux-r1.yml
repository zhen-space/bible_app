name: Student Global UX R1 Validation

on:
  pull_request:
    branches:
      - claude/bible-app-setup-xi8bvd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Student web build
        run: flutter build web
      - name: Admin web build
        run: flutter build web -t lib/main_admin.dart
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
