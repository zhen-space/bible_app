# Render Blueprint：靜態網站部署 Flutter Web 版
# 在 render.com 用「New +」→「Blueprint」連這個 repo 即可。
services:
  - type: web
    name: bible-app
    runtime: static
    branch: claude/bible-app-setup-xi8bvd
    buildCommand: ./render-build.sh
    staticPublishPath: build/web
    # 注意：不要加 COOP/COEP headers——same-origin 會擋 Firebase 登入；
    # sqflite 的 WASM 實測不需要這些 header（走 IndexedDB）。
    # 登入採 GIS token 流程，不需要 __/auth 代理路由。
